name: Private release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-sidecar:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Prepare patched source
        run: |
          git clone --quiet --depth 1 --branch v1.9.14 https://github.com/AlexxIT/go2rtc.git /tmp/go2rtc
          git -C /tmp/go2rtc apply "$GITHUB_WORKSPACE/third_party/go2rtc/patches/0001-roborock-region-client-id.patch"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          name="go2rtc-roborockmcp-${GOOS}-${GOARCH}${suffix}"
          go -C /tmp/go2rtc build -trimpath -ldflags '-s -w' -o "$GITHUB_WORKSPACE/$name" .
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go2rtc-roborockmcp-*

  release:
    needs: [build-python, build-sidecar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
