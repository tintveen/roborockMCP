[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "roborockmcp"
version = "0.1.0"
description = "A Codex-first MCP server with supervised stationary Roborock map repair."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Tillmann Int-Veen" }]
keywords = ["mcp", "codex", "roborock", "s8-maxv-ultra"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiohttp>=3.11,<4",
  "keyring>=25.6,<27",
  "mcp==2.1.1",
  "platformdirs>=4.4,<5",
  "pydantic>=2.11,<3",
  "python-roborock==7.1.1",
  "typer>=0.16,<1",
]

[project.urls]
Repository = "https://github.com/tintveen/roborockMCP"
Issues = "https://github.com/tintveen/roborockMCP/issues"

[project.scripts]
roborock-mcp = "roborock_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_mcp"]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=roborock_mcp --cov-report=term-missing --cov-fail-under=50"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires explicit human-in-the-loop authorization and a physical robot"]

[tool.coverage.run]
branch = true
source = ["roborock_mcp"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["roborock_mcp"]
warn_unreachable = true
